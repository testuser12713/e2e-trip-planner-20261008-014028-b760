<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Planner — Page not found</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header" data-od-id="app-header">
    <div class="app-header-inner">
      <a class="brand" href="index.html" data-od-id="brand-link">Trip Planner</a>
      <nav class="tabs" aria-label="Primary" data-od-id="primary-nav">
        <a class="tab" href="index.html" data-od-id="tab-trips">Trips</a>
        <span class="tab is-disabled" aria-disabled="true" title="Select a trip first">Itinerary</span>
        <span class="tab is-disabled" aria-disabled="true" title="Select a trip first">Budget</span>
        <span class="tab is-disabled" aria-disabled="true" title="Select a trip first">Packing</span>
      </nav>
    </div>
  </header>

  <main class="notfound" data-od-id="not-found">
    <p class="marker" data-od-id="not-found-marker">404</p>
    <h1 data-od-id="not-found-title">Page not found</h1>
    <p data-od-id="not-found-body">The page or trip you are looking for does not exist.</p>
    <a class="btn btn-secondary btn-auto" href="index.html" data-od-id="back-to-trips">Back to trips</a>
  </main>

</html>
